services:
  cantobot:
    container_name: cantobot
    image: cantobot:latest   
    environment:
      - CANTOBOT_PORT=${CANTOBOT_PORT}
      - ENV=${ENV}
      - POSTGRES_URI=${POSTGRES_URI}
    ports:
      - "${CANTOBOT_PORT}:${CANTOBOT_PORT}"
    networks:
      - cantobot_network
  db:
    container_name: cantobot-db
    image: postgres:16
    networks:
      - cantobot-network
    restart: always
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=evolution
    volumes:
      - cantobot_pg_data:/var/lib/postgresql/data
  
  redis:
    image: redis:latest
    networks:
      - cantobot-network
    container_name: cantobot-redis
    command: >
      redis-server --port 6379 --appendonly yes
    volumes:
      - evolution_redis:/data
    ports:
      - 6379:6379
  
  evolution-api:
    container_name: cantobot-evolution-api
    image: evoapicloud/evolution-api:latest
    restart: always
    networks:
      - cantobot-network
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    volumes:
      - evolution_instances:/evolution/instances
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: cantobot-whisper
    restart: unless-stopped
    environment:
      ASR_ENGINE: faster_whisper
      ASR_MODEL: small
    volumes:
      - whisper-cache:/root/.cache

networks:
  cantobot_network:
    name: cantobot_network
    driver: bridge

volumes:
  cantobot_pg_data:
  evolution_redis:
  evolution_instances:
  whisper-cache:
    